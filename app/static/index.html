<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Montreal Parking</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#f5f6f8; --fg:#1c2230; --muted:#5b6475; --card:#ffffff; --line:#d9dde5; --accent:#1d5fd1;
  --free:#2e9e4f; --limited:#19a7c4; --paid:#3b6fd8; --permit:#8e54c9; --reserved:#e8851a;
  --no_parking:#d63a3a; --no_stopping:#7a1020; --unknown:#8a8f99; --go:#1e9e44; --maybe:#d9a400; --nodata:#9aa3b2;
  --shadow:0 2px 8px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.12);
  --sheet-h:0px; --fab-lift:var(--sheet-h);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --fg:#e8ebf2; --muted:#9aa3b5; --card:#1b2030; --line:#2e3548; --accent:#6aa0ff;
  --free:#4cc16f; --limited:#3cc3e0; --paid:#6f9aff; --permit:#b585ee; --reserved:#f5a04a;
  --no_parking:#ff6b6b; --no_stopping:#d6455d; --unknown:#9aa0ab; --go:#3ddc6e; --maybe:#f2c14e; --nodata:#7d8799; --shadow:0 2px 10px rgba(0,0,0,.55);}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* the map fills the screen; everything else floats on top of it */
#map{position:fixed;inset:0}
#top{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
@media(min-width:700px){#top{right:auto;width:min(600px,calc(100vw - 24px))}}

.pill{margin:0 12px;display:flex;align-items:center;gap:8px;padding:5px 18px 5px 5px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.icon{width:42px;height:42px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center}
.icon:hover{background:rgba(127,127,127,.16)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:16px;margin:0;font-weight:700}
.ver{font-size:11px;color:var(--muted);line-height:1.15}

.rail{display:flex;gap:8px;overflow-x:auto;padding:2px 12px 8px;scrollbar-width:none;pointer-events:none}
.rail::-webkit-scrollbar{display:none}
#chips,#findLegend{display:contents}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--card);box-shadow:var(--shadow);user-select:none;font-size:14px;pointer-events:auto}
.chip svg.i{width:16px;height:16px}
.chip i{width:18px;height:5px;border-radius:3px;background:var(--c);display:inline-block}
.chip.dash i{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.chip[aria-pressed=false]{opacity:.62}
.chip[aria-pressed=false] i{filter:grayscale(1)}
.chip[aria-pressed=true]{border-color:var(--c)}
.chip.tool{--c:var(--accent);opacity:1}
.chip.tool[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

.panel{margin:0 12px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
#timePop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#timePop label{font-size:14px}
input[type=datetime-local],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
button.primary{background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:600;border-radius:8px;padding:6px 12px}
.findctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:var(--go)}
.findctl label{display:flex;gap:6px;align-items:center;font-size:14px}
#hint{display:none;margin:0 12px;align-self:flex-start;background:var(--card);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 24px)}

#menu{position:fixed;z-index:8;top:calc(max(10px,env(safe-area-inset-top)) + 56px);left:12px;width:220px;padding:6px;margin:0}
#menu a,#menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:inherit;text-decoration:none;font-size:15px}
#menu a:hover,#menu button:hover{background:rgba(127,127,127,.16)}
#menu form{margin:0}

#fabs{position:fixed;z-index:5;right:12px;bottom:calc(var(--fab-lift) + 16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#driveBtn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;box-shadow:var(--shadow)}
#driveBtn svg.i{fill:currentColor;stroke:none}
#driveBtn[aria-pressed=true]{background:#c0392b}

#sheet{position:fixed;z-index:6;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:none;max-height:55vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 12px}
#sheet .close{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px}
@media(min-width:700px){#sheet{left:12px;right:auto;width:460px;bottom:12px}:root{--fab-lift:0px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);border-left:8px solid var(--c,var(--unknown));border-radius:12px;padding:10px 12px;background:var(--card)}
.card .who{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card .big{font-size:22px;font-weight:700;margin:2px 0}
.card .fit{font-size:20px;font-weight:700;margin:2px 0}
.card .sub{color:var(--muted);font-size:14px}
.card ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.street{font-weight:700;margin:0 28px 8px 0}

/* map controls sit above the drive button / details card */
.maplibregl-ctrl-bottom-right{bottom:calc(var(--fab-lift) + 78px + env(safe-area-inset-bottom))}
.maplibregl-ctrl-bottom-left{bottom:var(--sheet-h)}
.maplibregl-ctrl-attrib{font-size:10px}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="pill">
    <button id="menuBtn" class="icon" aria-label="Menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand"><h1>Montreal Parking</h1><div class="ver">__VERSION__</div></div>
  </div>
  <div class="rail" id="rail">
    <button class="chip tool" id="timeChip" aria-label="Choose the time to show"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Now</span></button>
    <button class="chip tool" id="findBtn" aria-pressed="false" title="Show only curbs where you can park for a whole stay">Find parking</button>
    <span id="chips" role="group" aria-label="Parking types to show"></span>
    <span id="findLegend" hidden>
      <span class="chip" style="--c:var(--go)"><i></i>Free for the whole stay</span>
      <span class="chip" id="legendPaid" style="--c:var(--paid)" hidden><i></i>Fits if you pay</span>
      <span class="chip" style="--c:var(--maybe)"><i></i>Check the sign</span>
    </span>
  </div>
  <div class="panel" id="timePop" hidden>
    <label for="when">Show parking at</label>
    <input id="when" type="datetime-local">
    <button id="nowBtn" class="primary" title="Show parking right now">Now</button>
  </div>
  <div class="panel findctl" id="findCtl" hidden>
    <label for="stay">Stay</label><select id="stay"></select>
    <label><input type="checkbox" id="paid"> include paid</label>
  </div>
  <div id="hint"></div>
</div>

<div class="panel" id="menu" hidden>
  <a href="/settings">Settings</a>
  <form method="post" action="/logout"><button>Sign out</button></form>
</div>

<div id="fabs">
  <button id="driveBtn" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4z"/></svg><span id="driveLbl">Drive mode</span></button>
</div>

<div id="sheet"><button class="close" aria-label="Close">×</button><div id="sheetBody"></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
const TYPES = [
  {s:"free",        label:"Free"},
  {s:"limited",     label:"Free, time limit"},
  {s:"paid",        label:"Paid"},
  {s:"permit",      label:"Permit only"},
  {s:"reserved",    label:"Reserved (disabled, EV...)"},
  {s:"no_parking",  label:"No parking"},
  {s:"no_stopping", label:"No stopping", dash:true},
  {s:"unknown",     label:"Check sign"},
  {s:"nodata",      label:"No sign data"},
];
const LABEL = Object.fromEntries(TYPES.map(t => [t.s, t.label]));
const MIN_ZOOM = 14;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FIND_STATES = ["go", "maybe"];
const colors = () => Object.fromEntries([...TYPES.map(t => t.s), ...FIND_STATES].map(k => [k, css("--"+k)]));
const FIND_OPTS = [[30,"30 min"],[60,"1 hour"],[120,"2 hours"],[180,"3 hours"],[240,"4 hours"],[480,"8 hours"],[720,"12 hours"],[1440,"24 hours"]];
let find = Object.assign({on:false, minutes:120, paid:false}, JSON.parse(store.get("find") || "null") || {});
const findLabel = m => (FIND_OPTS.find(o => o[0] === m) || [m, m + " min"])[1];
const addFind = q => { if (find.on) { q.set("stay", find.minutes); if (find.paid) q.set("paid", "true"); } };

let active = new Set(JSON.parse(store.get("types") || "null") || TYPES.map(t => t.s));
let atTime = null;      // null = now
let drive = false;
let map, aborter, moveTimer;

/* ---------- chips ---------- */
const chipsEl = document.getElementById("chips");
for (const t of TYPES) {
  const b = document.createElement("button");
  b.className = "chip" + (t.dash ? " dash" : "");
  b.style.setProperty("--c", `var(--${t.s})`);
  b.setAttribute("aria-pressed", active.has(t.s));
  b.innerHTML = "<i></i>";
  b.append(t.label);
  b.onclick = () => {
    active.has(t.s) ? active.delete(t.s) : active.add(t.s);
    b.setAttribute("aria-pressed", active.has(t.s));
    store.set("types", JSON.stringify([...active]));
    applyFilter();
  };
  chipsEl.append(b);
}

/* ---------- map ---------- */
map = new maplibregl.Map({
  container: "map",
  center: JSON.parse(store.get("view") || "null")?.c || [-73.5673, 45.5017],
  zoom: JSON.parse(store.get("view") || "null")?.z || 15,
  style: {
    version: 8,
    sources: {osm: {type:"raster", tileSize:256, maxzoom:19,
      tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
      attribution:"© OpenStreetMap contributors"}},
    layers: [{id:"osm", type:"raster", source:"osm"}],
  },
  attributionControl: false,
});
map.addControl(new maplibregl.AttributionControl({compact: true,
  customAttribution: "Signs on the street are authoritative. Data: Ville de Montréal, Agence de mobilité durable (CC BY 4.0)"}), "bottom-left");
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "bottom-right");

function colorExpr() {
  const c = colors();
  const e = ["match", ["get","s"]];
  for (const k of [...TYPES.map(t => t.s), ...FIND_STATES]) e.push(k, c[k]);
  e.push(c.unknown);
  return e;
}
function applyFilter() {
  if (!map.getLayer("curb-solid")) return;
  if (find.on) {  // the server already returned only curbs that fit; show them all, solid
    const fit = ["in", ["get","s"], ["literal", ["go", "paid", "maybe"]]];
    map.setFilter("curb-casing", fit); map.setFilter("curb-solid", fit);
    map.setFilter("curb-dash", ["==", ["get","s"], "__none__"]);
    return;
  }
  const on = [...active];
  map.setFilter("curb-casing", ["in", ["get","s"], ["literal", on]]);
  map.setFilter("curb-solid", ["all", ["!=", ["get","s"], "no_stopping"], ["in", ["get","s"], ["literal", on]]]);
  map.setFilter("curb-dash",  ["all", ["==", ["get","s"], "no_stopping"], ["in", ["get","s"], ["literal", on]]]);
}
const width = ["interpolate", ["linear"], ["zoom"], 14, 2, 17, 5, 19, 8];

map.on("load", () => {
  document.querySelector(".maplibregl-ctrl-attrib")?.classList.remove("maplibregl-compact-show");
  map.addSource("curbs", {type:"geojson", data:{type:"FeatureCollection", features:[]}});
  map.addLayer({id:"curb-casing", type:"line", source:"curbs",
    paint:{"line-color":"#ffffff", "line-opacity":.85, "line-width":["interpolate",["linear"],["zoom"],14,3.5,17,8,19,12]},
    layout:{"line-cap":"round","line-join":"round"}});
  map.addLayer({id:"curb-solid", type:"line", source:"curbs",
    paint:{"line-color":colorExpr(), "line-width":width}, layout:{"line-cap":"round","line-join":"round"}});
  map.addLayer({id:"curb-dash", type:"line", source:"curbs",
    paint:{"line-color":colorExpr(), "line-width":width, "line-dasharray":[1.2,1.2]}, layout:{"line-join":"round"}});
  applyFilter();
  for (const id of ["curb-solid","curb-dash"]) {
    map.on("click", id, e => showCurb(e.features[0].properties.i, e.lngLat));
    map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", id, () => map.getCanvas().style.cursor = "");
  }
  load();
});
map.on("moveend", () => {
  store.set("view", JSON.stringify({c: map.getCenter().toArray(), z: map.getZoom()}));
  clearTimeout(moveTimer); moveTimer = setTimeout(load, 200);
});

function isoTime() { return atTime ? new Date(atTime).toISOString() : null; }
function hint(msg) {
  const h = document.getElementById("hint");
  h.style.display = msg ? "block" : "none"; h.textContent = msg || "";
}
async function api(path, params) {
  const q = new URLSearchParams(params);
  const t = isoTime(); if (t) q.set("t", t);
  addFind(q);
  const r = await fetch(path + "?" + q, {credentials:"same-origin", signal: params._signal});
  if (r.status === 401) { location.href = "/login"; throw new Error("login"); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.detail || r.statusText); }
  return r.json();
}
async function load() {
  if (!map.getSource("curbs")) return;
  if (map.getZoom() < MIN_ZOOM) { hint("Zoom in to see the sides of the street"); return; }
  const b = map.getBounds();
  aborter?.abort(); aborter = new AbortController();
  try {
    const q = new URLSearchParams({west:b.getWest(), south:b.getSouth(), east:b.getEast(), north:b.getNorth()});
    const t = isoTime(); if (t) q.set("t", t);
    addFind(q);
    const r = await fetch("/api/curbs?" + q, {credentials:"same-origin", signal: aborter.signal});
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) { hint((await r.json().catch(() => ({}))).detail || "Could not load"); return; }
    map.getSource("curbs").setData(await r.json());
    hint(null);
  } catch (e) { if (e.name !== "AbortError") hint("Could not load: " + e.message); }
}

/* ---------- time ---------- */
const whenEl = document.getElementById("when");
const timeChip = document.getElementById("timeChip"), timePop = document.getElementById("timePop");
function syncTimeChip() {
  timeChip.querySelector("span").textContent = atTime
    ? new Date(atTime).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"}) : "Now";
}
function setNow() { atTime = null; whenEl.value = ""; syncTimeChip(); timePop.hidden = true; load(); if (drive) lastFetch = 0; }
document.getElementById("nowBtn").onclick = setNow;
whenEl.onchange = () => { atTime = whenEl.value || null; syncTimeChip(); load(); lastFetch = 0; };
timeChip.onclick = () => { timePop.hidden = !timePop.hidden; };
setInterval(() => { if (!atTime) { load(); lastFetch = 0; } }, 5 * 60 * 1000);

/* ---------- details ---------- */
const sheet = document.getElementById("sheet"), sheetBody = document.getElementById("sheetBody");
sheet.querySelector(".close").onclick = () => { sheet.style.display = "none"; if (drive) renderDrive(); };

function fmtUntil(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = atTime ? new Date(atTime) : new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return sameDay ? time : d.toLocaleDateString([], {weekday:"short"}) + " " + time;
}
function fitText(f) {
  const dur = findLabel(find.minutes).toLowerCase();
  if (f.result === "go") return ["go", `\u2713 Free for ${dur}`];
  if (f.result === "paid") return ["paid", "\u2713 Fits if you pay" + (f.cost_cents ? `, about $${(f.cost_cents/100).toFixed(2)}` : "")];
  if (f.result === "maybe") return ["maybe", "? Check the sign"];
  const detail = (f.detail || "restricted").toLowerCase();
  const now = atTime ? new Date(atTime) : new Date();
  const soon = !f.at || new Date(f.at) - now < 90 * 1000;
  return ["no_parking", soon ? `\u2717 Not now: ${detail}` : `\u2717 Only until ${fmtUntil(f.at)}, then ${detail}`];
}
function card(info, who) {
  const el = document.createElement("div");
  const fit = info.fit ? fitText(info.fit) : null;
  el.className = "card"; el.style.setProperty("--c", `var(--${fit ? fit[0] : info.status})`);
  const w = document.createElement("div"); w.className = "who"; w.textContent = who; el.append(w);
  if (fit) { const f = document.createElement("div"); f.className = "fit"; f.textContent = fit[1]; el.append(f); }
  const big = document.createElement("div"); big.className = fit ? "sub" : "big";
  big.textContent = (fit ? "Now: " : "") + (info.status === "paid" && info.cents != null
    ? `Paid, $${(info.cents/100).toFixed(2)}/h` : (LABEL[info.status] || info.status));
  el.append(big);
  const sub = document.createElement("div"); sub.className = "sub";
  const bits = [];
  if (!fit && info.status !== "paid" && info.detail && !["Parking allowed","No restriction"].includes(info.detail)) bits.push(info.detail);
  if (info.status === "paid" && info.limit_min) bits.push(info.limit_min % 60 ? `${info.limit_min} min max` : `${info.limit_min/60} h max`);
  if (info.until) bits.push(`until ${fmtUntil(info.until)}` + (info.then ? `, then ${(LABEL[info.then.status] || info.then.status).toLowerCase()}` : ""));
  else if (info.status !== "unknown") bits.push("no change in the next 3 days");
  sub.textContent = bits.join(" \u00b7 "); el.append(sub);
  if (info.signs?.length) {
    const ul = document.createElement("ul");
    for (const s of info.signs) { const li = document.createElement("li"); li.textContent = s; ul.append(li); }
    el.append(ul);
  }
  if (!info.poles && !info.bays) { const n = document.createElement("div"); n.className = "sub"; n.textContent = "No sign data here"; el.append(n); }
  return el;
}
async function showCurb(i, lngLat) {
  try {
    const info = await api("/api/curb/" + i, {});
    sheetBody.replaceChildren();
    const s = document.createElement("div"); s.className = "street"; s.textContent = info.street; sheetBody.append(s);
    const cards = document.createElement("div"); cards.className = "cards";
    cards.append(card(info, info.side === "Gauche" ? "Left side of the street as drawn" : "Right side of the street as drawn"));
    sheetBody.append(cards);
    sheet.style.display = "block";
  } catch (e) { hint(e.message); }
}

/* ---------- drive mode ---------- */
let watchId = null, me = null, heading = null, lastFetch = 0, lastPos = null, here = null, marker = null;
const driveBtn = document.getElementById("driveBtn");
driveBtn.onclick = () => drive ? stopDrive() : startDrive();

function startDrive() {
  if (!navigator.geolocation) { hint("This browser has no location support"); return; }
  drive = true; driveBtn.setAttribute("aria-pressed", true); document.getElementById("driveLbl").textContent = "Stop";
  if (!marker) {
    const dot = document.createElement("div");
    dot.style.cssText = "width:16px;height:16px;border-radius:50%;background:#1d5fd1;border:3px solid #fff;box-shadow:0 0 0 2px #1d5fd1";
    marker = new maplibregl.Marker({element: dot});
  }
  watchId = navigator.geolocation.watchPosition(onPos, e => hint("Location: " + e.message),
    {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
}
function stopDrive() {
  drive = false; driveBtn.setAttribute("aria-pressed", false); document.getElementById("driveLbl").textContent = "Drive mode";
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; marker?.remove(); sheet.style.display = "none"; here = null;
}
async function onPos(p) {
  const {latitude: lat, longitude: lon, heading: h, speed} = p.coords;
  me = [lon, lat];
  if (h != null && !Number.isNaN(h) && (speed ?? 0) > 1.5) heading = h;
  marker.setLngLat(me).addTo(map);
  if (map.getZoom() < 16) map.setZoom(17);
  map.easeTo({center: me, duration: 500});
  const moved = !lastPos || Math.hypot((lon-lastPos[0])*79000, (lat-lastPos[1])*111000) > 8;
  if (Date.now() - lastFetch < 3000 || (!moved && Date.now() - lastFetch < 60000)) return;
  lastFetch = Date.now(); lastPos = me;
  try {
    const params = {lat, lon}; if (heading != null) params.heading = heading;
    here = await api("/api/here", params);
  } catch (e) { here = {error: e.message}; }
  renderDrive();
}
function renderDrive() {
  if (!drive || !here) return;
  sheetBody.replaceChildren();
  if (here.error) { sheetBody.textContent = here.error; sheet.style.display = "block"; return; }
  if (!here.found) { sheetBody.textContent = "No street with parking data within 45 m."; sheet.style.display = "block"; return; }
  const s = document.createElement("div"); s.className = "street"; s.textContent = here.street; sheetBody.append(s);
  if (find.on) {
    const h = document.createElement("div"); h.className = "sub"; h.style.marginBottom = "6px";
    h.textContent = `Looking for ${find.paid ? "" : "free "}parking for ${findLabel(find.minutes).toLowerCase()}`;
    sheetBody.append(h);
  }
  const cards = document.createElement("div"); cards.className = "cards";
  const sides = [...here.sides];
  if (heading != null) sides.sort((a, b) => (a.relative === "left" ? 0 : 1) - (b.relative === "left" ? 0 : 1));
  sides.forEach((info, k) => {
    const who = heading != null ? (info.relative === "right" ? "Your right" : "Your left")
      : (k === 0 ? "Nearest curb" : "Other side");
    cards.append(card(info, who));
  });
  sheetBody.append(cards);
  if (heading == null) {
    const n = document.createElement("div"); n.className = "sub"; n.style.marginTop = "8px";
    n.textContent = "Start moving so I can tell your left from your right."; sheetBody.append(n);
  }
  sheet.style.display = "block";
}

/* ---------- find parking ---------- */
const findBtn = document.getElementById("findBtn"), stayEl = document.getElementById("stay"), paidEl = document.getElementById("paid");
for (const [m, label] of FIND_OPTS) stayEl.add(new Option(label, m));
function syncFind() {
  stayEl.value = String(find.minutes); paidEl.checked = find.paid;
  findBtn.setAttribute("aria-pressed", find.on);
  document.getElementById("findCtl").hidden = !find.on;
  document.getElementById("findLegend").hidden = !find.on;
  document.getElementById("legendPaid").hidden = !find.paid;
  document.getElementById("chips").hidden = find.on;
}
function findChanged() {
  store.set("find", JSON.stringify(find)); syncFind(); applyFilter();
  sheet.style.display = "none"; load(); lastFetch = 0; if (drive && me) onPos({coords: {latitude: me[1], longitude: me[0], heading: heading, speed: 0}});
}
findBtn.onclick = () => { find.on = !find.on; findChanged(); };
stayEl.onchange = () => { find.minutes = Number(stayEl.value); findChanged(); };
paidEl.onchange = () => { find.paid = paidEl.checked; findChanged(); };
syncFind();

/* ---------- menu, and keeping the map controls above the details card ---------- */
const menuBtn = document.getElementById("menuBtn"), menu = document.getElementById("menu");
menuBtn.onclick = (e) => { menu.hidden = !menu.hidden; menuBtn.setAttribute("aria-expanded", String(!menu.hidden)); e.stopPropagation(); };
document.addEventListener("click", (e) => {
  if (!menu.hidden && !menu.contains(e.target)) { menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
});
new ResizeObserver(() => {
  const h = sheet.style.display === "none" ? 0 : sheet.offsetHeight;
  document.documentElement.style.setProperty("--sheet-h", h ? (h + 12) + "px" : "0px");
}).observe(sheet);
</script>
</body>
